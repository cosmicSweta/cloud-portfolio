
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloud Portfolio</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f0f4f8;
      color: #1e293b;
    }

    header {
      background: #123456;
      color: white;
      padding: 25px;
      text-align: center;
    }

    main {
      max-width: 750px;
      margin: 50px auto;
      padding: 30px;
      background: white;
      border-radius: 12px;
      text-align: center;
    }

    h2 {
      color: #2563eb;
    }

    .projects {
      text-align: left;
      line-height: 2;
    }

    button {
      padding: 12px 22px;
      border: none;
      border-radius: 6px;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }

    footer {
      text-align: center;
      padding: 20px;
    }
  </style>
</head>
<body>
  <header>
    <h1>My Cloud Portfolio</h1>
    <p>Learning, Building and Growing</p>
  </header>

  <main>
    <h2>Welcome to My Website!</h2>
    <p>This static website demonstrates cloud-based web hosting.</p>

    <h2>My Projects</h2>
    <div class="projects">
      <p>1. To-Do List Application</p>
      <p>2. Weather Dashboard</p>
      <p>3. E-Commerce Website</p>
    </div>

    <button onclick="showMessage()">Click Here</button>
    <p id="message"></p>
  </main>

  <footer>
    Cloud & IoT Practical — Static Website Hosting
  </footer>

  <script>
    function showMessage() {
      document.getElementById("message").textContent =
        "Website is working successfully!";
    }
  </script>
</body>
</html>
